# pispot-authd configuration
# Restart pispot-authd after changing group names:
#   sudo systemctl restart pispot-authd

# The groups are levels. Each one requires all those above it in this file, and
# a group doesn't count unless the account is also in every earlier one.
[groups]
# Basic access: read-only dashboard. Every account needs this group.
readonly = pispot-ro

# Full admin dashboard access.
admin    = pispot-admin

# Same access as admin, but can't be changed or deleted from the dashboard.
owner    = pispot-owner
